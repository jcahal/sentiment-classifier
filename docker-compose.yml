services:
  notebook:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    restart: unless-stopped

  shell:
    image: python:3.11-slim
    volumes:
      - .:/app
    working_dir: /app
    command: bash
    stdin_open: true
    tty: true

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./model:/app/model
      - ./api:/app/api
    environment:
      - MODEL_PATH=/app/model/saved_model
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped
